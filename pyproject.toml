[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "plaidnox-sast-agent"
version = "0.1.0"
description = "Context-aware, static-only source code security analysis pipeline"
requires-python = ">=3.11"
dependencies = [
  "Jinja2>=3.1,<4.0",
  "PyYAML>=6.0",
  "SQLAlchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "tree-sitter>=0.25,<0.27",
  "tree-sitter-language-pack>=1.9,<3.0",
]

[project.optional-dependencies]
ai = ["litellm>=1.101,<2.0"]

[project.scripts]
plaidnox-sast = "plaidnox_sast.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
plaidnox_sast = ["assets/**/*.json", "assets/**/*.md", "assets/**/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
