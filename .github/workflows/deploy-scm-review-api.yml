name: Deploy SCM review API

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: scm-review-api-production
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: plaidnox-scm-review-api
  ECS_CLUSTER: plaidnox-scm-apis
  ECS_SERVICE: plaidnox-scm-review-api
  ECS_CONTAINER: scm-review-api

jobs:
  deploy:
    name: Build and deploy scanner API
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sign in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/code-scanning/Dockerfile.scm-api
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Load current task definition
        run: |
          service_definition=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" --query 'services[0].taskDefinition' --output text)
          aws ecs describe-task-definition --task-definition "$service_definition" --query taskDefinition --output json > task-definition-base.json
          jq --arg container "$ECS_CONTAINER" '
            .containerDefinitions |= map(
              if .name == $container then
                .environment = ((.environment // []) | map(select(.name != "PLAIDNOX_SCM_MIGRATE_ONLY")))
              else . end
            )
          ' task-definition-base.json > task-definition.json

      - name: Render task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.ECS_CONTAINER }}
          image: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Apply SCM database migrations
        env:
          TASK_DEFINITION: ${{ steps.task-def.outputs.task-definition }}
        run: |
          jq --arg container "$ECS_CONTAINER" '
            .containerDefinitions |= map(
              if .name == $container then
                .environment = ((.environment // [] | map(select(.name != "PLAIDNOX_SCM_MIGRATE_ONLY"))) + [{"name":"PLAIDNOX_SCM_MIGRATE_ONLY","value":"true"}])
              else . end
            )
          ' "$TASK_DEFINITION" > migration-task-definition.json
          migration_definition=$(aws ecs register-task-definition --cli-input-json file://migration-task-definition.json --query taskDefinition.taskDefinitionArn --output text)
          aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" --query 'services[0].networkConfiguration' --output json > network-configuration.json
          migration_task=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --launch-type FARGATE \
            --task-definition "$migration_definition" \
            --network-configuration file://network-configuration.json \
            --query 'tasks[0].taskArn' --output text)
          if [ -z "$migration_task" ] || [ "$migration_task" = "None" ]; then
            echo "ECS did not start the migration task"
            exit 1
          fi
          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$migration_task"
          exit_code=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$migration_task" --query 'tasks[0].containers[?name==`scm-review-api`].exitCode | [0]' --output text)
          if [ "$exit_code" != "0" ]; then
            aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$migration_task" --query 'tasks[0].{stopCode:stopCode,stoppedReason:stoppedReason,containers:containers[].{name:name,exitCode:exitCode,reason:reason}}' --output json
            exit 1
          fi

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true
